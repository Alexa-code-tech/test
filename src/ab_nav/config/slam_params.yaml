slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    resolution: 0.05
    max_laser_range: 6.0
    minimum_time_interval: 0.3
    transform_publish_period: 0.05
    map_update_interval: 1.0
    throttle_scans: 1
